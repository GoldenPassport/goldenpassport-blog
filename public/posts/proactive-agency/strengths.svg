<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Agents are the muscle. Process intelligence is the foresight.</title>
  <desc id="desc">Three lanes. Process intelligence sees each journey in context, with live monitoring, prediction and gap analysis. Workflows carry the established paths consistently. One journey drifts off course after step 3; process intelligence spots the gap and triggers an agent. The agent chooses an appropriate response: steer back, find a new path, or refer to an authorised person, who decides.</desc>
  <defs>
    <style>
      .h1 { fill:#0F1B2D; font:600 32px Georgia, serif }
      .h2 { fill:#2A3548; font:400 19px Arial, sans-serif }
      .tag { font:700 13px Arial, sans-serif; letter-spacing:0.18em }
      .lane { fill:#0F1B2D; font:600 24px Georgia, serif }
      .desc { fill:#2A3548; font:400 16px Arial, sans-serif }
      .step { fill:#5B6577; font:400 14px Arial, sans-serif; text-anchor:middle }
      .note { font:italic 700 15px Arial, sans-serif }
      .opt { font:700 15px Arial, sans-serif }
      .foot { fill:#5B6577; font:italic 400 16px Arial, sans-serif }
      .brand { fill:#8C661F; font:700 16px Arial, sans-serif; letter-spacing:0.05em }
    </style>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8C661F"/>
    </marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F7A5A"/>
    </marker>
    <marker id="rd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9B3A32"/>
    </marker>
    <marker id="nv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0F1B2D"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#FBF7EF"/>

  <text class="h1" x="64" y="66">Agents are the muscle. Process intelligence is the foresight.</text>
  <text class="h2" x="64" y="100">Workflows carry the journeys. Process intelligence spots where help is needed. Agents adapt the response.</text>
  <line x1="64" y1="124" x2="1136" y2="124" stroke="#B8893B" stroke-width="1.5"/>

  <!-- lane dividers -->
  <line x1="64" y1="282" x2="1136" y2="282" stroke="#E8DCC3" stroke-width="1"/>
  <line x1="64" y1="486" x2="1136" y2="486" stroke="#E8DCC3" stroke-width="1"/>

  <!-- ===== Lane labels ===== -->
  <text class="tag" x="64" y="180" style="fill:#0F1B2D">PROCESS INTELLIGENCE</text>
  <text class="lane" x="64" y="212">Sight</text>
  <text class="desc" x="64" y="240">Sees each journey</text>
  <text class="desc" x="64" y="260">in context.</text>

  <text class="tag" x="64" y="342" style="fill:#8C661F">WORKFLOWS</text>
  <text class="lane" x="64" y="374">Consistency</text>
  <text class="desc" x="64" y="402">Carry established</text>
  <text class="desc" x="64" y="422">paths reliably.</text>

  <text class="tag" x="64" y="528" style="fill:#2F7A5A">AGENTS</text>
  <text class="lane" x="64" y="560">Judgement</text>
  <text class="desc" x="64" y="588">Adapt the response</text>
  <text class="desc" x="64" y="608">where needed.</text>

  <!-- ===== PI lane ===== -->
  <rect x="320" y="150" width="790" height="104" rx="14" fill="#0F1B2D"/>
  <path d="M600 202 C630 176 690 176 720 202 C690 228 630 228 600 202 z" fill="none" stroke="#FBF7EF" stroke-width="2.5"/>
  <circle cx="660" cy="202" r="11" fill="#B8893B"/>
  <circle cx="660" cy="202" r="4.5" fill="#0F1B2D"/>
  <text x="346" y="208" style="fill:#D9C9A8;font:400 17px Arial, sans-serif">Learns from history</text>
  <text x="756" y="196" style="fill:#FBF7EF;font:700 17px Arial, sans-serif">Live monitoring, prediction</text>
  <text x="756" y="220" style="fill:#FBF7EF;font:700 17px Arial, sans-serif">and gap analysis</text>
  <!-- sight lines -->
  <line x1="380" y1="254" x2="380" y2="290" stroke="#0F1B2D" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="520" y1="254" x2="520" y2="290" stroke="#0F1B2D" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="820" y1="254" x2="820" y2="290" stroke="#0F1B2D" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="960" y1="254" x2="960" y2="290" stroke="#0F1B2D" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="668" y1="254" x2="746" y2="446" stroke="#9B3A32" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text class="note" x="690" y="276" style="fill:#9B3A32">gap spotted</text>

  <!-- ===== Workflow lane ===== -->
  <text class="step" x="380" y="306">Step 1</text>
  <text class="step" x="520" y="306">Step 2</text>
  <text class="step" x="660" y="306">Step 3</text>
  <text class="step" x="820" y="306">Step 4</text>
  <text class="step" x="960" y="306">Step 5</text>
  <text x="1086" y="306" style="fill:#8C661F;font:700 14px Arial, sans-serif;text-anchor:middle">Goal</text>
  <g fill="#F5EDDC">
    <rect x="358" y="314" width="44" height="120" rx="8"/>
    <rect x="498" y="314" width="44" height="120" rx="8"/>
    <rect x="638" y="314" width="44" height="120" rx="8"/>
    <rect x="798" y="314" width="44" height="120" rx="8"/>
    <rect x="938" y="314" width="44" height="120" rx="8"/>
  </g>
  <rect x="1072" y="314" width="28" height="120" rx="8" fill="#8C661F"/>
  <line x1="320" y1="334" x2="1068" y2="334" stroke="#8C661F" stroke-width="3" marker-end="url(#g)"/>
  <line x1="320" y1="362" x2="1068" y2="362" stroke="#8C661F" stroke-width="3" marker-end="url(#g)"/>
  <line x1="320" y1="390" x2="1068" y2="390" stroke="#8C661F" stroke-width="3" marker-end="url(#g)"/>
  <!-- drifting journey -->
  <line x1="320" y1="418" x2="680" y2="418" stroke="#8C661F" stroke-width="3"/>
  <path d="M680 418 C712 418 726 440 748 452" fill="none" stroke="#9B3A32" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="752" cy="455" r="7" fill="#FBF7EF" stroke="#9B3A32" stroke-width="2.5"/>
  <text class="note" x="596" y="470" style="fill:#9B3A32;text-anchor:middle">drifting off course</text>
  <!-- 1: steered back -->
  <path d="M760 455 C790 455 796 418 818 418" fill="none" stroke="#2F7A5A" stroke-width="3.5"/>
  <line x1="818" y1="418" x2="1068" y2="418" stroke="#8C661F" stroke-width="3" marker-end="url(#g)"/>
  <!-- 2: new path to the same goal -->
  <path d="M760 458 C800 470 900 470 1000 466 C1040 464 1056 452 1068 432" fill="none" stroke="#2F7A5A" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#gr)"/>
  <circle cx="804" cy="440" r="10" fill="#2F7A5A"/><text x="804" y="444.5" style="fill:#FBF7EF;font:700 12px Arial, sans-serif;text-anchor:middle">1</text>
  <circle cx="930" cy="468" r="10" fill="#2F7A5A"/><text x="930" y="472.5" style="fill:#FBF7EF;font:700 12px Arial, sans-serif;text-anchor:middle">2</text>

  <!-- ===== Agent lane ===== -->
  <!-- trigger: the gap calls the agent -->
  <line x1="749" y1="463" x2="698" y2="537" stroke="#9B3A32" stroke-width="2.2" marker-end="url(#rd)"/>
  <rect x="600" y="546" width="170" height="44" rx="22" fill="#2F7A5A"/>
  <text x="685" y="574" style="fill:#FBF7EF;font:700 16px Arial, sans-serif;text-anchor:middle">Agent steps in</text>

  <text x="850" y="508" style="fill:#2F7A5A;font:italic 700 15px Arial, sans-serif">Choose an appropriate response</text>
  <!-- branches: alternative responses -->
  <path d="M770 568 C800 568 812 531 842 531" fill="none" stroke="#2F7A5A" stroke-width="2" marker-end="url(#gr)"/>
  <path d="M770 568 L842 568" fill="none" stroke="#2F7A5A" stroke-width="2" marker-end="url(#gr)"/>
  <path d="M770 568 C800 568 812 607 842 607" fill="none" stroke="#0F1B2D" stroke-width="2" marker-end="url(#nv)"/>

  <g class="opt">
    <rect x="850" y="516" width="286" height="30" rx="15" fill="#FEFCF8" stroke="#2F7A5A" stroke-width="1.5"/>
    <circle cx="868" cy="531" r="9" fill="#2F7A5A"/><text x="868" y="535.5" style="fill:#FBF7EF;font:700 12px Arial, sans-serif;text-anchor:middle">1</text>
    <text x="886" y="536" style="fill:#2F7A5A">Steer back</text>

    <rect x="850" y="554" width="286" height="30" rx="15" fill="#FEFCF8" stroke="#2F7A5A" stroke-width="1.5"/>
    <circle cx="868" cy="569" r="9" fill="#2F7A5A"/><text x="868" y="573.5" style="fill:#FBF7EF;font:700 12px Arial, sans-serif;text-anchor:middle">2</text>
    <text x="886" y="574" style="fill:#2F7A5A">Find a new path</text>

    <rect x="850" y="592" width="286" height="30" rx="15" fill="#0F1B2D"/>
    <circle cx="868" cy="603" r="4" fill="#FBF7EF"/>
    <path d="M861 616 C861 609 875 609 875 616 z" fill="#FBF7EF"/>
    <text x="886" y="612" style="fill:#FBF7EF">Refer to an authorised person</text>
  </g>

  <text class="foot" x="64" y="650">Build on proven business logic. Adapt the journey where it improves the outcome.</text>
  <text class="brand" x="1136" y="650" text-anchor="end">goldenpassport.blog</text>
</svg>
