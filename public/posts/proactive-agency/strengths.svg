<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Agents are the muscle. Process intelligence is the foresight.</title>
  <desc id="desc">Three lanes, each playing to its strength. Top, process intelligence gives sight: it watches every journey live against what the customer and the business expect, and spots the gap when a journey drifts. Middle, workflows give consistency: four journeys run through five steps to their goal on the typical path. One journey drifts off course after step 3. Bottom, agents give judgement: they handle the unexpected and make each journey personal, within set boundaries. When a journey drifts, an agent steps in with one of three outcomes: steer it back onto the typical path, find a new path that still meets the goal and may prove a better way, or flag it to a person to decide. Workflows keep years of domain logic, enhanced with agency; nothing is ripped out.</desc>
  <defs>
    <style>
      .h1 { fill:#0F1B2D; font:600 32px Georgia, serif }
      .h2 { fill:#2A3548; font:400 19px Arial, sans-serif }
      .tag { font:700 12px Arial, sans-serif; letter-spacing:0.2em }
      .lane { fill:#0F1B2D; font:600 22px Georgia, serif }
      .desc { fill:#2A3548; font:400 14px Arial, sans-serif }
      .step { fill:#5B6577; font:400 12px Arial, sans-serif; text-anchor:middle }
      .note { font:italic 600 13px Arial, sans-serif }
      .foot { fill:#5B6577; font:italic 400 15px Arial, sans-serif }
      .brand { fill:#8C661F; font:700 15px Arial, sans-serif; letter-spacing:0.05em }
    </style>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8C661F"/>
    </marker>
    <marker id="gr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2F7A5A"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#FBF7EF"/>

  <text class="h1" x="64" y="66">Agents are the muscle. Process intelligence is the foresight.</text>
  <text class="h2" x="64" y="100">Play to everyone's strengths: workflows carry the journeys, PI watches them, agents make each one personal.</text>
  <line x1="64" y1="124" x2="1136" y2="124" stroke="#B8893B" stroke-width="1.5"/>

  <!-- lane dividers -->
  <line x1="64" y1="282" x2="1136" y2="282" stroke="#E8DCC3" stroke-width="1"/>
  <line x1="64" y1="486" x2="1136" y2="486" stroke="#E8DCC3" stroke-width="1"/>

  <!-- ===== Lane labels ===== -->
  <text class="tag" x="64" y="176" style="fill:#0F1B2D">PROCESS INTELLIGENCE</text>
  <text class="lane" x="64" y="206">Sight</text>
  <text class="desc" x="64" y="232">Watches every journey live,</text>
  <text class="desc" x="64" y="251">against what the customer and</text>
  <text class="desc" x="64" y="270">the business expect.</text>

  <text class="tag" x="64" y="332" style="fill:#8C661F">WORKFLOWS</text>
  <text class="lane" x="64" y="362">Consistency</text>
  <text class="desc" x="64" y="388">Carry the journeys that are</text>
  <text class="desc" x="64" y="407">on track, with years of domain</text>
  <text class="desc" x="64" y="426">logic built in, at low cost.</text>

  <text class="tag" x="64" y="524" style="fill:#2F7A5A">AGENTS</text>
  <text class="lane" x="64" y="554">Judgement</text>
  <text class="desc" x="64" y="580">Handle the unexpected and</text>
  <text class="desc" x="64" y="599">make each journey personal,</text>
  <text class="desc" x="64" y="618">within set boundaries.</text>

  <!-- ===== PI lane ===== -->
  <rect x="320" y="150" width="790" height="104" rx="14" fill="#0F1B2D"/>
  <!-- eye -->
  <path d="M600 202 C630 176 690 176 720 202 C690 228 630 228 600 202 z" fill="none" stroke="#FBF7EF" stroke-width="2.5"/>
  <circle cx="660" cy="202" r="11" fill="#B8893B"/>
  <circle cx="660" cy="202" r="4.5" fill="#0F1B2D"/>
  <text x="760" y="198" style="fill:#FBF7EF;font:700 14px Arial, sans-serif">Live monitoring</text>
  <text x="760" y="218" style="fill:#D9C9A8;font:400 13px Arial, sans-serif">and gap analysis on every journey</text>
  <text x="344" y="198" style="fill:#D9C9A8;font:400 13px Arial, sans-serif">Learns good and bad</text>
  <text x="344" y="218" style="fill:#D9C9A8;font:400 13px Arial, sans-serif">from history</text>
  <!-- sight lines -->
  <line x1="380" y1="254" x2="380" y2="290" stroke="#0F1B2D" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="520" y1="254" x2="520" y2="290" stroke="#0F1B2D" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="820" y1="254" x2="820" y2="290" stroke="#0F1B2D" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="960" y1="254" x2="960" y2="290" stroke="#0F1B2D" stroke-width="1.2" stroke-dasharray="2 4"/>
  <line x1="668" y1="254" x2="746" y2="446" stroke="#9B3A32" stroke-width="1.8" stroke-dasharray="4 4"/>
  <text class="note" x="690" y="274" style="fill:#9B3A32">gap spotted</text>

  <!-- ===== Workflow lane ===== -->
  <text class="step" x="380" y="306">Step 1</text>
  <text class="step" x="520" y="306">Step 2</text>
  <text class="step" x="660" y="306">Step 3</text>
  <text class="step" x="820" y="306">Step 4</text>
  <text class="step" x="960" y="306">Step 5</text>
  <text x="1086" y="306" style="fill:#8C661F;font:700 12px Arial, sans-serif;text-anchor:middle">Goal</text>
  <!-- steps as light columns -->
  <g fill="#F5EDDC">
    <rect x="358" y="314" width="44" height="120" rx="8"/>
    <rect x="498" y="314" width="44" height="120" rx="8"/>
    <rect x="638" y="314" width="44" height="120" rx="8"/>
    <rect x="798" y="314" width="44" height="120" rx="8"/>
    <rect x="938" y="314" width="44" height="120" rx="8"/>
  </g>
  <rect x="1072" y="314" width="28" height="120" rx="8" fill="#8C661F"/>
  <!-- on-track journeys -->
  <line x1="320" y1="334" x2="1068" y2="334" stroke="#8C661F" stroke-width="3" marker-end="url(#g)"/>
  <line x1="320" y1="362" x2="1068" y2="362" stroke="#8C661F" stroke-width="3" marker-end="url(#g)"/>
  <line x1="320" y1="390" x2="1068" y2="390" stroke="#8C661F" stroke-width="3" marker-end="url(#g)"/>
  <!-- drifting journey -->
  <line x1="320" y1="418" x2="680" y2="418" stroke="#8C661F" stroke-width="3"/>
  <path d="M680 418 C712 418 726 440 748 452" fill="none" stroke="#9B3A32" stroke-width="3" stroke-dasharray="6 4"/>
  <circle cx="752" cy="455" r="7" fill="#FBF7EF" stroke="#9B3A32" stroke-width="2.5"/>
  <text class="note" x="596" y="468" style="fill:#9B3A32;text-anchor:middle">drifting off course</text>
  <!-- steered back -->
  <path d="M760 455 C790 455 796 418 818 418" fill="none" stroke="#2F7A5A" stroke-width="3.5"/>
  <line x1="818" y1="418" x2="1068" y2="418" stroke="#8C661F" stroke-width="3" marker-end="url(#g)"/>

  <!-- ===== Agent lane ===== -->
  <!-- outcome 2: a new path to the same goal -->
  <path d="M760 458 C800 470 900 470 1000 466 C1040 464 1056 452 1068 432" fill="none" stroke="#2F7A5A" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#gr)"/>
  <circle cx="804" cy="440" r="9" fill="#2F7A5A"/><text x="804" y="444" style="fill:#FBF7EF;font:700 11px Arial, sans-serif;text-anchor:middle">1</text>
  <circle cx="930" cy="468" r="9" fill="#2F7A5A"/><text x="930" y="472" style="fill:#FBF7EF;font:700 11px Arial, sans-serif;text-anchor:middle">2</text>

  <line x1="752" y1="463" x2="530" y2="528" stroke="#2F7A5A" stroke-width="2" stroke-dasharray="3 3"/>
  <rect x="425" y="528" width="160" height="40" rx="20" fill="#2F7A5A"/>
  <text x="505" y="553" style="fill:#FBF7EF;font:700 14px Arial, sans-serif;text-anchor:middle">Agent steps in</text>
  <path d="M591 548 L605 548" stroke="#2F7A5A" stroke-width="2" marker-end="url(#gr)"/>

  <g style="font:700 13px Arial, sans-serif">
    <rect x="611" y="530" width="124" height="36" rx="18" fill="#FEFCF8" stroke="#2F7A5A" stroke-width="1.5"/>
    <text x="673" y="553" style="fill:#2F7A5A;text-anchor:middle">1 · Steer back</text>
    <rect x="747" y="530" width="124" height="36" rx="18" fill="#FEFCF8" stroke="#2F7A5A" stroke-width="1.5"/>
    <text x="809" y="553" style="fill:#2F7A5A;text-anchor:middle">2 · New path</text>
    <rect x="883" y="530" width="152" height="36" rx="18" fill="#FEFCF8" stroke="#0F1B2D" stroke-width="1.5"/>
    <circle cx="901" cy="542" r="4" fill="#0F1B2D"/>
    <path d="M894 556 C894 549 908 549 908 556 z" fill="#0F1B2D"/>
    <text x="970" y="553" style="fill:#0F1B2D;text-anchor:middle">3 · Flag a person</text>
  </g>
  <g style="font:italic 400 11.5px Arial, sans-serif">
    <text x="673" y="586" style="fill:#2F7A5A;text-anchor:middle">onto the typical path</text>
    <text x="809" y="586" style="fill:#2F7A5A;text-anchor:middle">same goal, new route;</text>
    <text x="809" y="601" style="fill:#2F7A5A;text-anchor:middle">may prove better</text>
    <text x="959" y="586" style="fill:#0F1B2D;text-anchor:middle">a person decides</text>
  </g>

  <text class="foot" x="64" y="652">Workflows keep years of domain logic, enhanced with agency. Nothing is ripped out.</text>
  <text class="brand" x="1136" y="652" text-anchor="end">goldenpassport.blog</text>
</svg>
