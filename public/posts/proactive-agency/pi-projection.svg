<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">How process intelligence projects a journey</title>
  <desc id="desc">Illustrative example, not real data. Two panels. Left, learn from history: a process map of ten thousand past cases through five steps, Apply, Verify, Assess, Decide and Complete. Thick gold lines show the typical path, with 9.6 thousand, 10.2 thousand, 9.1 thousand and 8.7 thousand cases on each step. Orange lines show loopbacks, the key pattern, which add waits, re-tasks, repetition and stress: 1.3 thousand loop back from Assess to Verify for rework, 0.8 thousand are re-tasked from Decide back to Assess, and 0.6 thousand are asked again at Verify. Red dashed lines show drop-offs: 0.9 thousand leave after Verify and 0.4 thousand leave after Decide. Right, project one case: a customer at step 3 of 5. Apply took 1 day, Verify 2 days and Assess 5 days against a typical 2. Decide is projected at 3 to 5 days and Complete at 1 to 2 days, from similar past cases. After 8 days so far, the projected finish is day 12 to 15 against an expected day 10. From this point, 71 per cent of similar cases follow the typical path, 20 per cent loop back, adding 5 days, and 9 per cent leave. The gap of 2 to 5 days late triggers an agent to step in.</desc>
  <defs>
    <style>
      .h1 { fill:#0F1B2D; font:600 40px Georgia, serif }
      .h2 { fill:#2A3548; font:400 20px Arial, sans-serif }
      .tag { fill:#8C661F; font:700 12px Arial, sans-serif; letter-spacing:0.2em }
      .title { fill:#0F1B2D; font:600 24px Georgia, serif }
      .sub { fill:#2A3548; font:400 14px Arial, sans-serif }
      .node { fill:#0F1B2D; font:600 14px Arial, sans-serif }
      .pill { fill:#2A3548; font:700 11px Arial, sans-serif; text-anchor:middle }
      .edge { fill:#5B6577; font:italic 400 11px Arial, sans-serif; text-anchor:middle }
      .step { fill:#0F1B2D; font:600 13px Arial, sans-serif; text-anchor:middle }
      .dur { fill:#2A3548; font:400 12px Arial, sans-serif; text-anchor:middle }
      .proj { fill:#8C661F; font:italic 600 12px Arial, sans-serif; text-anchor:middle }
      .red { fill:#9B3A32; font:700 12px Arial, sans-serif }
      .small { fill:#5B6577; font:italic 400 12px Arial, sans-serif }
      .axis { fill:#5B6577; font:400 11px Arial, sans-serif; text-anchor:middle }
      .label { fill:#8C661F; font:700 11px Arial, sans-serif; letter-spacing:0.16em }
      .key { fill:#2A3548; font:400 14px Arial, sans-serif }
      .brand { fill:#8C661F; font:700 15px Arial, sans-serif; letter-spacing:0.05em }
    </style>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#B8612A"/>
    </marker>
    <marker id="redm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9B3A32"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#F5EDDC"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#B8893B" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="#FBF7EF"/>

  <text class="h1" x="64" y="68">How process intelligence projects a journey</text>
  <text x="1136" y="68" style="fill:#5B6577;font:italic 400 15px Arial, sans-serif;text-anchor:end">Illustrative example</text>
  <text class="h2" x="64" y="102">Learn the typical path from history, then project how the rest of this customer's journey will go.</text>
  <line x1="64" y1="126" x2="1136" y2="126" stroke="#B8893B" stroke-width="1.5"/>

  <!-- ================= Left: learn from history ================= -->
  <rect x="64" y="146" width="520" height="484" rx="14" fill="#FEFCF8" stroke="#B8893B" stroke-width="1.25"/>
  <text class="tag" x="88" y="182">1 · LEARN FROM HISTORY</text>
  <text class="title" x="88" y="214">Typical path, loopbacks and drop-offs</text>
  <text class="sub" x="88" y="240">10k past cases. Counts are step transitions, including repeats.</text>

  <g transform="translate(0 8)">
  <line x1="250" y1="286" x2="250" y2="314" stroke="#8C661F" stroke-width="6"/>
  <path d="M242 312 L258 312 L250 322 z" fill="#8C661F"/>
  <line x1="250" y1="358" x2="250" y2="386" stroke="#8C661F" stroke-width="6.2"/>
  <path d="M242 384 L258 384 L250 394 z" fill="#8C661F"/>
  <line x1="250" y1="430" x2="250" y2="458" stroke="#8C661F" stroke-width="5.6"/>
  <path d="M242 456 L258 456 L250 466 z" fill="#8C661F"/>
  <line x1="250" y1="502" x2="250" y2="530" stroke="#8C661F" stroke-width="5.2"/>
  <path d="M242 528 L258 528 L250 538 z" fill="#8C661F"/>

  <path d="M175 404 C122 404 122 340 169 340" fill="none" stroke="#B8612A" stroke-width="3.2" marker-end="url(#orange)"/>
  <path d="M175 484 C108 484 108 420 169 420" fill="none" stroke="#B8612A" stroke-width="2.6" marker-end="url(#orange)"/>
  <path d="M325 330 C378 300 378 356 331 348" fill="none" stroke="#B8612A" stroke-width="2.4" marker-end="url(#orange)"/>

  <path d="M318 358 C470 370 480 400 480 532" fill="none" stroke="#9B3A32" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#redm)"/>
  <path d="M325 490 C400 490 400 556 414 556" fill="none" stroke="#9B3A32" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#redm)"/>

  <rect x="175" y="250" width="150" height="36" rx="18" fill="#F5EDDC" stroke="#0F1B2D" stroke-width="1.25"/>
  <circle cx="196" cy="268" r="7" fill="#FEFCF8" stroke="#0F1B2D" stroke-width="1.5"/>
  <text class="node" x="212" y="273">Apply</text>
  <rect x="175" y="322" width="150" height="36" rx="18" fill="#F5EDDC" stroke="#0F1B2D" stroke-width="1.25"/>
  <circle cx="196" cy="340" r="7" fill="#FEFCF8" stroke="#0F1B2D" stroke-width="1.5"/>
  <text class="node" x="212" y="345">Verify</text>
  <rect x="175" y="394" width="150" height="36" rx="18" fill="#F5EDDC" stroke="#0F1B2D" stroke-width="1.25"/>
  <circle cx="196" cy="412" r="7" fill="#FEFCF8" stroke="#0F1B2D" stroke-width="1.5"/>
  <text class="node" x="212" y="417">Assess</text>
  <rect x="175" y="466" width="150" height="36" rx="18" fill="#F5EDDC" stroke="#0F1B2D" stroke-width="1.25"/>
  <circle cx="196" cy="484" r="7" fill="#FEFCF8" stroke="#0F1B2D" stroke-width="1.5"/>
  <text class="node" x="212" y="489">Decide</text>
  <rect x="175" y="538" width="150" height="36" rx="18" fill="#F5EDDC" stroke="#0F1B2D" stroke-width="1.25"/>
  <circle cx="196" cy="556" r="7" fill="#FEFCF8" stroke="#0F1B2D" stroke-width="1.5"/>
  <text class="node" x="212" y="561">Complete</text>
  <rect x="420" y="538" width="120" height="36" rx="18" fill="#FEFCF8" stroke="#9B3A32" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="node" x="480" y="561" style="fill:#9B3A32;text-anchor:middle">Left journey</text>

  <rect x="262" y="293" width="46" height="18" rx="9" fill="#FEFCF8" stroke="#B8893B"/><text class="pill" x="285" y="306">9.6k</text>
  <rect x="262" y="365" width="46" height="18" rx="9" fill="#FEFCF8" stroke="#B8893B"/><text class="pill" x="285" y="378">10.2k</text>
  <rect x="262" y="437" width="46" height="18" rx="9" fill="#FEFCF8" stroke="#B8893B"/><text class="pill" x="285" y="450">9.1k</text>
  <rect x="262" y="509" width="46" height="18" rx="9" fill="#FEFCF8" stroke="#B8893B"/><text class="pill" x="285" y="522">8.7k</text>

  <rect x="95" y="363" width="80" height="18" rx="9" fill="#FEFCF8" stroke="#B8612A"/><text class="pill" x="135" y="376" style="fill:#B8612A">1.3k rework</text>
  <rect x="84" y="443" width="84" height="18" rx="9" fill="#FEFCF8" stroke="#B8612A"/><text class="pill" x="126" y="456" style="fill:#B8612A">0.8k re-task</text>
  <rect x="352" y="319" width="40" height="18" rx="9" fill="#FEFCF8" stroke="#B8612A"/><text class="pill" x="372" y="332" style="fill:#B8612A">0.6k</text>
  <text class="edge" x="372" y="310" style="fill:#B8612A">asked again</text>

  <rect x="458" y="431" width="44" height="18" rx="9" fill="#FEFCF8" stroke="#9B3A32"/><text class="pill" x="480" y="444" style="fill:#9B3A32">0.9k</text>
  <rect x="365" y="506" width="40" height="18" rx="9" fill="#FEFCF8" stroke="#9B3A32"/><text class="pill" x="385" y="519" style="fill:#9B3A32">0.4k</text>
  </g>

  <rect x="88" y="596" width="472" height="24" rx="12" fill="#F8ECE2" stroke="#B8612A" stroke-width="1"/>
  <text x="324" y="612" xml:space="preserve" style="text-anchor:middle;font:700 12.5px Arial, sans-serif"><tspan fill="#B8612A">Loopbacks: </tspan><tspan fill="#2A3548" font-weight="400">added waits, re-tasks, repetition and stress</tspan></text>

  <!-- ================= Right: project one case ================= -->
  <rect x="616" y="146" width="520" height="484" rx="14" fill="#FEFCF8" stroke="#B8893B" stroke-width="1.25"/>
  <text class="tag" x="640" y="182">2 · PROJECT ONE CASE</text>
  <text class="title" x="640" y="214">One customer, at step 3 of 5</text>
  <text class="sub" x="640" y="240">Steps 1 to 3 have happened. Steps 4 and 5 are</text>
  <text class="sub" x="640" y="258">projected from similar cases in the history.</text>

  <!-- timeline -->
  <line x1="660" y1="316" x2="876" y2="316" stroke="#0F1B2D" stroke-width="2.5"/>
  <line x1="876" y1="316" x2="1092" y2="316" stroke="#8C661F" stroke-width="2.5" stroke-dasharray="6 5"/>
  <circle cx="660" cy="316" r="13" fill="#0F1B2D"/>
  <polyline points="654 316 658.5 320.5 666 312" fill="none" stroke="#FEFCF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="768" cy="316" r="13" fill="#0F1B2D"/>
  <polyline points="762 316 766.5 320.5 774 312" fill="none" stroke="#FEFCF8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="876" cy="316" r="13" fill="#0F1B2D" stroke="#9B3A32" stroke-width="3"/>
  <circle cx="984" cy="316" r="13" fill="#FEFCF8" stroke="#8C661F" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="1092" cy="316" r="13" fill="#FEFCF8" stroke="#8C661F" stroke-width="2" stroke-dasharray="4 3"/>
  <text class="red" x="876" y="286" text-anchor="middle">Today</text>
  <path d="M870 291 L882 291 L876 298 z" fill="#9B3A32"/>

  <text class="step" x="660" y="350">Apply</text><text class="dur" x="660" y="367">1 day</text>
  <text class="step" x="768" y="350">Verify</text><text class="dur" x="768" y="367">2 days</text>
  <text class="step" x="876" y="350">Assess</text><text class="dur" x="876" y="367" style="fill:#9B3A32;font-weight:700">5 days</text>
  <text class="axis" x="876" y="382" style="font-style:italic">typical 2</text>
  <text class="step" x="984" y="350">Decide</text><text class="proj" x="984" y="367">3 to 5 days</text>
  <text class="step" x="1092" y="350">Complete</text><text class="proj" x="1092" y="367">1 to 2 days</text>

  <!-- days to complete -->
  <text class="label" x="640" y="414">DAYS TO COMPLETE</text>
  <text class="red" x="882" y="414">Expected: day 10</text>
  <rect x="640" y="424" width="189" height="20" rx="3" fill="#0F1B2D"/>
  <text x="652" y="438" style="fill:#FEFCF8;font:700 12px Arial, sans-serif">8 days so far</text>
  <rect x="829" y="424" width="94" height="20" fill="#B8893B"/>
  <rect x="923" y="424" width="71" height="20" fill="url(#hatch)" stroke="#B8893B" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="1000" y="438" style="fill:#8C661F;font:italic 700 12px Arial, sans-serif">Projected</text>
  <line x1="876" y1="418" x2="876" y2="452" stroke="#9B3A32" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="640" y1="452" x2="1112" y2="452" stroke="#C9CFD8" stroke-width="1"/>
  <line x1="640" y1="452" x2="640" y2="457" stroke="#C9CFD8"/><text class="axis" x="640" y="470">0</text>
  <line x1="758" y1="452" x2="758" y2="457" stroke="#C9CFD8"/><text class="axis" x="758" y="470">5</text>
  <line x1="876" y1="452" x2="876" y2="457" stroke="#C9CFD8"/><text class="axis" x="876" y="470">10</text>
  <line x1="994" y1="452" x2="994" y2="457" stroke="#C9CFD8"/><text class="axis" x="994" y="470">15</text>
  <line x1="1112" y1="452" x2="1112" y2="457" stroke="#C9CFD8"/><text class="axis" x="1108" y="470">20</text>
  <!-- gap bracket -->
  <path d="M876 480 L876 486 L994 486 L994 480" fill="none" stroke="#9B3A32" stroke-width="1.8"/>
  <text class="red" x="935" y="502" text-anchor="middle">2 to 5 days late</text>

  <!-- similar cases -->
  <text class="label" x="640" y="530">SIMILAR CASES FROM THIS POINT</text>
  <rect x="640" y="540" width="335" height="14" fill="#8C661F"/>
  <rect x="975" y="540" width="94" height="14" fill="#B8612A"/>
  <rect x="1069" y="540" width="43" height="14" fill="#9B3A32"/>
  <text class="dur" x="640" y="572" style="text-anchor:start">71% typical path</text>
  <text class="dur" x="1052" y="572" style="text-anchor:end;fill:#B8612A">20% loop back, +5 days</text>
  <text class="dur" x="1112" y="572" style="text-anchor:end;fill:#9B3A32">9% leave</text>

  <!-- trigger -->
  <rect x="640" y="598" width="472" height="22" rx="11" fill="#F7E7E3" stroke="#9B3A32" stroke-width="1"/>
  <text x="876" y="613" xml:space="preserve" text-anchor="middle" style="font:700 12.5px Arial, sans-serif"><tspan fill="#9B3A32">Gap: 2 to 5 days late. </tspan><tspan fill="#2F7A5A">An agent steps in.</tspan></text>

  <!-- key and brand -->
  <line x1="64" y1="652" x2="92" y2="652" stroke="#8C661F" stroke-width="5"/>
  <text class="key" x="100" y="657">Typical path</text>
  <line x1="208" y1="652" x2="236" y2="652" stroke="#B8612A" stroke-width="3"/>
  <text class="key" x="244" y="657">Loopback</text>
  <line x1="334" y1="652" x2="362" y2="652" stroke="#9B3A32" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="key" x="370" y="657">Drop-off</text>
  <circle cx="466" cy="652" r="7" fill="#FEFCF8" stroke="#8C661F" stroke-width="2" stroke-dasharray="3 2"/>
  <text class="key" x="479" y="657">Projected</text>
  <rect x="573" y="646" width="12" height="12" rx="2" fill="#9B3A32"/>
  <text class="key" x="593" y="657">Gap</text>
  <text class="brand" x="1136" y="657" text-anchor="end">goldenpassport.blog</text>
</svg>
