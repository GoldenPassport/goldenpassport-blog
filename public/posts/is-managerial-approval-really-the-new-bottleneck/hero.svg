<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The manager is not the bottleneck; the missing context is</title>
  <desc id="desc">A hero graphic rebutting the idea that AI made the manager the new bottleneck. The headline reads: the manager is not the bottleneck; the missing context around the decision is. Below, a flow shows that AI output only becomes business value once context (outcome, boundaries, evidence) is added, ending in a fast, well-founded sign-off.</desc>
  <defs>
    <style>
      .eyebrow { fill:#8C661F; font:700 18px Arial, sans-serif; letter-spacing:0.18em }
      .head { fill:#0F1B2D; font:600 68px Georgia, serif }
      .headgold { fill:#8C661F; font:600 68px Georgia, serif }
      .sub { fill:#2A3548; font:400 27px Arial, sans-serif }
      .pill { fill:#0F1B2D; font:600 26px Georgia, serif; text-anchor:middle }
      .pillsub { fill:#5B6577; font:400 15px Arial, sans-serif; text-anchor:middle }
      .pillsubg { fill:#8C661F; font:700 15px Arial, sans-serif; text-anchor:middle; letter-spacing:0.02em }
      .brand { fill:#8C661F; font:700 17px Arial, sans-serif; letter-spacing:0.06em }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#FBF7EF"/>
  <rect x="0" y="0" width="1200" height="8" fill="#B8893B"/>

  <text class="eyebrow" x="72" y="96">PROCESS ORCHESTRATION · AGENTIC AI</text>

  <text class="head" x="70" y="212">The manager isn't</text>
  <text x="70" y="288"><tspan class="head">the </tspan><tspan class="headgold">bottleneck.</tspan></text>
  <text class="sub" x="72" y="344">The missing context around the decision is.</text>

  <!-- reframe flow: output + context = value -->
  <!-- pill A: AI output -->
  <rect x="72" y="430" width="250" height="104" rx="18" fill="#FEFCF8" stroke="#B8893B" stroke-width="1.5" stroke-opacity="0.4"/>
  <text class="pill" x="197" y="478">AI output</text>
  <text class="pillsub" x="197" y="506">drafts, code, options</text>

  <!-- arrow A to B -->
  <g stroke="#B8893B" stroke-width="3" fill="#B8893B">
    <line x1="330" y1="482" x2="356" y2="482"/>
    <polygon points="356,476 366,482 356,488" stroke="none"/>
  </g>

  <!-- pill B: add context (highlighted) -->
  <rect x="374" y="422" width="384" height="120" rx="18" fill="#FCF3E1" stroke="#B8893B" stroke-width="2.5"/>
  <text class="pill" x="566" y="476">Add context</text>
  <text class="pillsubg" x="566" y="506">OUTCOME · BOUNDARIES · EVIDENCE</text>

  <!-- arrow B to C -->
  <g stroke="#B8893B" stroke-width="3" fill="#B8893B">
    <line x1="766" y1="482" x2="792" y2="482"/>
    <polygon points="792,476 802,482 792,488" stroke="none"/>
  </g>

  <!-- pill C: business value -->
  <rect x="810" y="430" width="318" height="104" rx="18" fill="#FEFCF8" stroke="#B8893B" stroke-width="1.5" stroke-opacity="0.4"/>
  <path d="M852 474 l9 10 l18 -22" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="pill" x="985" y="478">Business value</text>
  <text class="pillsub" x="985" y="506">a fast, sound sign-off</text>

  <text class="brand" x="72" y="596">goldenpassport.blog</text>
</svg>
