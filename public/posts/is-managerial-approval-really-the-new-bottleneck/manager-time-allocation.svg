<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">How middle managers allocate their working time</title>
  <desc id="desc">Donut chart showing 31 percent individual contributor work, 28 percent talent and people management, 23 percent strategy-focused work and 18 percent administrative work.</desc>
  <rect width="1400" height="760" rx="28" fill="#FEFCF8"/>
  <text x="80" y="78" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#0F1B2D">A manager's attention is already divided</text>
  <text x="80" y="119" font-family="Arial, sans-serif" font-size="21" fill="#5B6577">Average share of working time reported by 706 middle managers</text>

  <g transform="translate(390 420) rotate(-90)">
    <circle r="190" fill="none" stroke="#F5EDDC" stroke-width="95"/>
    <circle r="190" fill="none" stroke="#0F1B2D" stroke-width="95" pathLength="100" stroke-dasharray="31 69" stroke-dashoffset="0"/>
    <circle r="190" fill="none" stroke="#B8893B" stroke-width="95" pathLength="100" stroke-dasharray="28 72" stroke-dashoffset="-31"/>
    <circle r="190" fill="none" stroke="#D4A857" stroke-width="95" pathLength="100" stroke-dasharray="23 77" stroke-dashoffset="-59"/>
    <circle r="190" fill="none" stroke="#5B6577" stroke-width="95" pathLength="100" stroke-dasharray="18 82" stroke-dashoffset="-82"/>
  </g>
  <g transform="translate(390 420)">
    <text y="-16" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#0F1B2D">706</text>
    <text y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#5B6577">middle managers</text>
  </g>

  <g font-family="Arial, sans-serif">
    <g transform="translate(760 225)">
      <rect width="28" height="28" rx="5" fill="#0F1B2D"/>
      <text x="50" y="24" font-size="30" font-weight="700" fill="#0F1B2D">31%</text>
      <text x="140" y="23" font-size="23" fill="#2A3548">Individual-contributor work</text>
    </g>
    <g transform="translate(760 315)">
      <rect width="28" height="28" rx="5" fill="#B8893B"/>
      <text x="50" y="24" font-size="30" font-weight="700" fill="#0F1B2D">28%</text>
      <text x="140" y="23" font-size="23" fill="#2A3548">Talent and people management</text>
    </g>
    <g transform="translate(760 405)">
      <rect width="28" height="28" rx="5" fill="#D4A857"/>
      <text x="50" y="24" font-size="30" font-weight="700" fill="#0F1B2D">23%</text>
      <text x="140" y="23" font-size="23" fill="#2A3548">Strategy-focused work</text>
    </g>
    <g transform="translate(760 495)">
      <rect width="28" height="28" rx="5" fill="#5B6577"/>
      <text x="50" y="24" font-size="30" font-weight="700" fill="#0F1B2D">18%</text>
      <text x="140" y="23" font-size="23" fill="#2A3548">Administrative work</text>
    </g>
  </g>

  <line x1="80" y1="675" x2="1320" y2="675" stroke="#B8893B" stroke-opacity="0.35"/>
  <text x="80" y="714" font-family="Arial, sans-serif" font-size="17" fill="#5B6577">Source: McKinsey Global Survey on middle managers, 706 respondents, 2022.</text>
</svg>
