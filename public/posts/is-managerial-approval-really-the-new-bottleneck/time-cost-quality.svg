<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">The time, cost, quality and risk relationship</title>
  <desc id="desc">A triangle connecting time, cost and quality and risk, with sustainable value at the centre.</desc>
  <rect width="1400" height="850" rx="28" fill="#FEFCF8"/>
  <text x="700" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#0F1B2D">Faster is only valuable when the whole triangle holds</text>
  <text x="700" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" fill="#5B6577">Changing one constraint changes the pressure on the others</text>

  <path d="M700 214 L285 662 L1115 662 Z" fill="#FBF7EF" stroke="#B8893B" stroke-width="7" stroke-linejoin="round"/>
  <path d="M700 300 L395 622" fill="none" stroke="#D4A857" stroke-width="2" stroke-dasharray="8 10"/>
  <path d="M700 300 L1005 622" fill="none" stroke="#D4A857" stroke-width="2" stroke-dasharray="8 10"/>
  <path d="M430 622 L970 622" fill="none" stroke="#D4A857" stroke-width="2" stroke-dasharray="8 10"/>

  <g transform="translate(700 235)">
    <circle r="96" fill="#0F1B2D"/>
    <text y="-12" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FEFCF8">QUALITY</text>
    <text y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#FEFCF8">AND RISK</text>
    <text y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#F5EDDC">Will it work safely?</text>
  </g>

  <g transform="translate(285 662)">
    <circle r="96" fill="#B8893B"/>
    <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#FEFCF8">TIME</text>
    <text y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#FEFCF8">How quickly?</text>
  </g>

  <g transform="translate(1115 662)">
    <circle r="96" fill="#8C661F"/>
    <text y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#FEFCF8">COST</text>
    <text y="27" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#FEFCF8">What resources?</text>
  </g>

  <g transform="translate(700 525)">
    <circle r="125" fill="#FEFCF8" stroke="#0F1B2D" stroke-width="5"/>
    <text y="-15" text-anchor="middle" font-family="Georgia, serif" font-size="27" font-weight="700" fill="#0F1B2D">SUSTAINABLE</text>
    <text y="21" text-anchor="middle" font-family="Georgia, serif" font-size="29" font-weight="700" fill="#0F1B2D">VALUE</text>
    <text y="59" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5B6577">Useful, usable and trusted</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="18" fill="#2A3548">
    <text x="398" y="367" text-anchor="middle" transform="rotate(-47 398 367)">Compressing time can move risk into quality</text>
    <text x="1002" y="367" text-anchor="middle" transform="rotate(47 1002 367)">Assurance and rework consume time and cost</text>
    <text x="700" y="746" text-anchor="middle">AI can improve productivity, but it does not remove the trade-offs</text>
  </g>
</svg>
