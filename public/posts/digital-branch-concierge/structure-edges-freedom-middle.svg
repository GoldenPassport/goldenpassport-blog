<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Structure at the edges, freedom in the middle</title>
  <desc id="desc">Three nested layers with a customer request entering on the left. The outer band is process orchestration: human accountability, the automated decision-making line, process lineage and business observability. The middle band is the agent: a reason, act, observe loop around the model, with a pre-action authorisation check on act: only authorised calls run, and a refusal is a result the agent observes and reasons about again. It reaches skills through known paths and read-only tools and knowledge through dynamic step discovery. The inner core is skills: bounded, typed, risk-rated capabilities. The agent's output passes through a deterministic impact and policy gate on the outer band: straight-through items go directly to the outcome chevron, items that need review go to a named human decision owner and reach the outcome only after meaningful human review. Traces from each run feed a learning loop on the outer band, where step sequences that worked, tool issues and knowledge gaps are reviewed, evaluated and only then promoted back into skills, tools and knowledge as approved updates.</desc>
  <defs>
    <style>
      .h1 { fill:#0F1B2D; font:600 44px Georgia, serif }
      .h2 { fill:#2A3548; font:400 23px Arial, sans-serif }
      .band { fill:#8C661F; font:700 14px Arial, sans-serif; letter-spacing:0.22em }
      .tag { fill:#5B6577; font:italic 400 15px Arial, sans-serif; text-anchor:end }
      .item { fill:#2A3548; font:400 15px Arial, sans-serif }
      .pill { fill:#0F1B2D; font:600 13px Arial, sans-serif; text-anchor:middle }
      .pillsub { fill:#8C661F; font:700 11px Arial, sans-serif; text-anchor:middle; letter-spacing:0.08em }
      .node { fill:#0F1B2D; font:600 15px Arial, sans-serif; text-anchor:middle }
      .note { fill:#5B6577; font:italic 400 15px Arial, sans-serif; text-anchor:middle }
      .callout { fill:#9B3A32; font:800 13px Arial, sans-serif; letter-spacing:0.08em; text-anchor:middle }
      .brand { fill:#8C661F; font:700 16px Arial, sans-serif; letter-spacing:0.05em }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8C661F"/>
    </marker>
    <marker id="arrowred" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9B3A32"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#FBF7EF"/>

  <text class="h1" x="64" y="70">Structure at the edges, freedom in the middle.</text>
  <text class="h2" x="64" y="108" style="font-size:21px">Deterministic process outside. Governed skills inside. Dynamic agency in the middle.</text>
  <line x1="64" y1="134" x2="1136" y2="134" stroke="#B8893B" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- ===== OUTER: process orchestration (structure) ===== -->
  <rect x="64" y="160" width="1072" height="452" rx="22" fill="#F5EDDC" stroke="#8C661F" stroke-width="2.5"/>
  <text class="band" x="90" y="190">PROCESS ORCHESTRATION</text>
  <!-- what the outer layer owns -->
  <g class="item">
    <text x="412" y="190">Human accountability</text>
    <text x="602" y="190">The ADM line*</text>
    <text x="742" y="190">Process lineage / Business observability</text>
  </g>
  <g fill="#8C661F"><circle cx="399" cy="185" r="3"/><circle cx="589" cy="185" r="3"/><circle cx="729" cy="185" r="3"/></g>

  <!-- human decision on the outer band -->
  <rect x="884" y="218" width="200" height="98" rx="10" fill="#FEFCF8" stroke="#8C661F" stroke-width="2"/>
  <text class="pill" x="984" y="243">Human decision</text>
  <text class="pillsub" x="984" y="261">NAMED DECISION OWNER</text>
  <text class="pillsub" x="984" y="276">CAN CHANGE THE OUTCOME</text>
  <text class="note" x="984" y="295" style="font-size:12px">by policy: lending, complaints,</text>
  <text class="note" x="984" y="309" style="font-size:12px">closures and vulnerability</text>

  <!-- ===== MIDDLE: the agent (freedom) ===== -->
  <rect x="120" y="222" width="740" height="360" rx="18" fill="#FBF7EF" stroke="#B8893B" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="band" x="146" y="252">THE AGENT</text>
  <text class="item" x="262" y="252">reason, act, observe and adapt until the goal is reached, within set limits</text>

  <!-- the loop: reason -> act -> observe -> reason -->
  <g>
    <circle cx="238" cy="330" r="34" fill="#FEFCF8" stroke="#8C661F" stroke-width="2"/>
    <text class="node" x="238" y="335">reason</text>
    <circle cx="328" cy="470" r="34" fill="#FEFCF8" stroke="#8C661F" stroke-width="2"/>
    <text class="node" x="328" y="475">act</text>
    <rect x="286" y="425" width="84" height="20" rx="10" fill="#F5EDDC" stroke="#8C661F" stroke-width="2"/>
    <text x="328" y="439" text-anchor="middle" fill="#8C661F" font-family="Arial, sans-serif" font-size="10.5" font-weight="800" letter-spacing="0.03em">AUTHORISED?</text>
    <circle cx="160" cy="470" r="34" fill="#FEFCF8" stroke="#8C661F" stroke-width="2"/>
    <text class="node" x="160" y="475">observe</text>
    <path d="M262 356 Q292 388 300 422" fill="none" stroke="#8C661F" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- pre-action authorisation sits on act: a deterministic process control, so only authorised calls run; a refusal is a result the agent observes -->
    <path d="M294 478 Q244 494 196 478" fill="none" stroke="#8C661F" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M184 446 Q194 396 214 356" fill="none" stroke="#8C661F" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- the model at the centre of the loop: AI sparkles plus label -->
    <path d="M242 386 L248 402 L264 408 L248 414 L242 430 L236 414 L220 408 L236 402 Z" fill="#8C661F"/>
    <path d="M264 382 L266.5 388.5 L273 391 L266.5 393.5 L264 400 L261.5 393.5 L255 391 L261.5 388.5 Z" fill="#B8893B"/>
    <text x="242" y="455" text-anchor="middle" fill="#0F1B2D" font-family="Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="0.1em">LLM</text>
  </g>
  <!-- request in (left port) -->
  <polygon points="16,340 92,340 116,378 92,416 16,416" fill="#8C661F" stroke="#8C661F" stroke-width="2" stroke-linejoin="round"/>
  <text class="pill" x="57" y="383" style="fill:#FBF7EF;font-size:14px">Request</text>
  <path d="M118 378 Q160 358 202 336" fill="none" stroke="#8C661F" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== INNER: skills (structure) ===== -->
  <!-- known paths: the agent reaches skills only through bounded, allow-listed routes -->
  <text class="note" x="397" y="416" font-size="12" style="text-anchor:end;paint-order:stroke;stroke:#FBF7EF;stroke-width:5px;stroke-linejoin:round">known paths</text>
  <rect x="400" y="290" width="400" height="170" rx="14" fill="#FEFCF8" stroke="#8C661F" stroke-width="2.5"/>
  <text class="band" x="420" y="318">SKILLS</text>
  <!-- skill chips with risk ratings -->
  <g>
    <rect x="420" y="330" width="176" height="46" rx="9" fill="#F5EDDC" stroke="#B8893B" stroke-width="1.5"/>
    <text class="pill" x="508" y="349">Print statement</text>
    <text class="pillsub" x="508" y="366">READ ONLY · LOW</text>

    <rect x="610" y="330" width="176" height="46" rx="9" fill="#F5EDDC" stroke="#B8893B" stroke-width="1.5"/>
    <text class="pill" x="698" y="349">Fetch balance</text>
    <text class="pillsub" x="698" y="366">READ ONLY · LOW</text>

    <rect x="420" y="384" width="176" height="46" rx="9" fill="#F5EDDC" stroke="#B8893B" stroke-width="1.5"/>
    <text class="pill" x="508" y="403">Book appointment</text>
    <text class="pillsub" x="508" y="420">REVERSIBLE · LOW</text>

    <rect x="610" y="384" width="176" height="46" rx="9" fill="#F5EDDC" stroke="#B8893B" stroke-width="1.5"/>
    <text class="pill" x="698" y="403">Update contact details</text>
    <text class="pillsub" x="698" y="420">WRITES DATA · MEDIUM</text>
  </g>
  <text class="note" x="600" y="450" font-size="12">bounded, typed and risk-rated; not modifiable by the agent</text>

  <!-- dynamic discovery: the agent finds and calls tools at runtime, from an allow-listed registry -->
  <path d="M354 494 L398 516" fill="none" stroke="#8C661F" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="note" x="314" y="530" font-size="12">dynamic step discovery</text>

  <!-- TOOLS (what the agent can do, via MCP) and KNOWLEDGE (what it can consult, via RAG) -->
  <rect x="400" y="478" width="400" height="94" rx="14" fill="#FEFCF8" stroke="#8C661F" stroke-width="2.5"/>
  <line x1="616" y1="488" x2="616" y2="562" stroke="#B8893B" stroke-width="1.5" stroke-opacity="0.5"/>
  <text class="band" x="416" y="498">TOOLS</text>
  <text class="tag" x="604" y="498" style="font-size:12px">read-only, via MCP</text>
  <g>
    <rect x="412" y="506" width="92" height="22" rx="6" fill="#F5EDDC" stroke="#B8893B" stroke-width="1.2"/>
    <text class="pill" x="458" y="521" style="font-size:11.5px">get_statement</text>
    <rect x="508" y="506" width="92" height="22" rx="6" fill="#F5EDDC" stroke="#B8893B" stroke-width="1.2"/>
    <text class="pill" x="554" y="521" style="font-size:12px">get_balance</text>
    <rect x="412" y="534" width="92" height="22" rx="6" fill="#F5EDDC" stroke="#B8893B" stroke-width="1.2"/>
    <text class="pill" x="458" y="549" style="font-size:12px">find_slots</text>
    <rect x="508" y="534" width="92" height="22" rx="6" fill="#F5EDDC" stroke="#B8893B" stroke-width="1.2"/>
    <text class="pill" x="554" y="549" style="font-size:11.5px">opening_hours</text>
  </g>
  <text class="band" x="630" y="498" style="letter-spacing:0.1em">KNOWLEDGE</text>
  <text class="tag" x="784" y="498" style="font-size:12px">via RAG</text>
  <g>
    <rect x="628" y="506" width="160" height="22" rx="6" fill="#F5EDDC" stroke="#B8893B" stroke-width="1.2"/>
    <text class="pill" x="708" y="521" style="font-size:12px">fees and product terms</text>
    <rect x="628" y="534" width="160" height="22" rx="6" fill="#F5EDDC" stroke="#B8893B" stroke-width="1.2"/>
    <text class="pill" x="708" y="549" style="font-size:12px">branch policies and FAQs</text>
  </g>

  <!-- act -> skills -->
  <path d="M362 462 L398 442" fill="none" stroke="#8C661F" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- escalation: anything that changes a life leaves the agent's band -->

  <!-- output (agent's right edge) -> outcome (process's right edge) -->
  <rect x="846" y="440" width="88" height="52" rx="10" fill="#FEFCF8" stroke="#8C661F" stroke-width="2"/>
  <text class="pill" x="890" y="471">Output</text>
  <path d="M934 466 L1014 466" fill="none" stroke="#8C661F" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- deterministic impact and policy gate on the outer band (a BPMN-style gateway): the process, not the agent, decides what is ADM -->
  <polygon points="1040,442 1064,466 1040,490 1016,466" fill="#F5EDDC" stroke="#8C661F" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="1040" y="470" text-anchor="middle" fill="#8C661F" font-family="Arial, sans-serif" font-size="9.5" font-weight="800" letter-spacing="0.06em">ADM?</text>
  <text class="note" x="1040" y="512" style="font-size:12px">impact and policy gate</text>
  <text class="note" x="1040" y="527" style="font-size:11px">deterministic</text>
  <path d="M1040 442 L1040 320" fill="none" stroke="#9B3A32" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrowred)"/>
  <path d="M1064 466 Q1120 466 1120 428" fill="none" stroke="#8C661F" stroke-width="2" marker-end="url(#arrow)"/>
  <text class="callout" x="1096" y="482" style="text-anchor:middle;font-size:11px;fill:#8C661F">STRAIGHT</text>
  <text class="callout" x="1096" y="495" style="text-anchor:middle;font-size:11px;fill:#8C661F">THROUGH</text>

  <!-- review leg label, beside the gate like STRAIGHT THROUGH on the other leg -->
  <text class="callout" x="1030" y="410" style="text-anchor:end;font-size:11px">MEANINGFUL</text>
  <text class="callout" x="1030" y="424" style="text-anchor:end;font-size:11px">HUMAN REVIEW</text>

  <!-- ADM route: human decision -> outcome, only after a person has signed -->
  <path d="M1084 258 Q1110 258 1110 290 L1110 344" fill="none" stroke="#9B3A32" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrowred)"/>
  <polygon points="1068,348 1164,348 1188,386 1164,424 1068,424 1092,386" fill="#8C661F" stroke="#8C661F" stroke-width="2" stroke-linejoin="round"/>
  <text class="pill" x="1130" y="391" style="fill:#FBF7EF;font-size:14px">Outcome</text>

  <!-- learning loop on the outer band: traces are reviewed and evaluated, and only then promoted back into skills, tools and knowledge -->
  <path d="M900 492 L900 556" fill="none" stroke="#8C661F" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text class="note" x="906" y="528" style="text-anchor:start;font-size:11px">traces</text>
  <rect x="868" y="558" width="252" height="46" rx="10" fill="#FEFCF8" stroke="#8C661F" stroke-width="2"/>
  <text class="pill" x="994" y="578">Learning loop</text>
  <text class="pillsub" x="994" y="595" style="font-size:10.5px">REVIEWED · EVALUATED · PROMOTED</text>
  <path d="M868 594 L828 594 L828 375 L804 375" fill="none" stroke="#8C661F" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <path d="M828 525 L804 525" fill="none" stroke="#8C661F" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <text class="note" x="0" y="0" transform="translate(846 380) rotate(-90)" style="font-size:12px;font-style:italic;fill:#8C661F;font-weight:700">approved updates</text>

  <text class="note" x="64" y="646" style="text-anchor:start;font-size:12px">* ADM (automated decision-making): a solely automated decision with legal or similarly significant effects. EU: GDPR Article 22.</text>
  <text class="brand" x="1136" y="646" style="text-anchor:end">goldenpassport.blog</text>
</svg>
