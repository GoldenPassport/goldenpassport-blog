<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-labelledby="t d"><title id="t">Governance</title><desc id="d">Governance in the Portal: prompt attack detection as a setting, twelve test conversations scored by five judges, a named decision owner who signs in, and an audit log row for every decision.</desc><defs><style>.t{font-family:Inter,Helvetica,Arial,sans-serif}.cap{font-weight:800;letter-spacing:0.06em}.sub{font-weight:500;fill:#3A4458}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#121C2E"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F7A6E"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8893A"/></marker></defs><rect width="400" height="560" rx="20" fill="#F5F4F0"/>
<rect x="100" y="22" width="200" height="44" rx="22" fill="#121C2E"/><text class="t cap" x="200" y="51" font-size="19" text-anchor="middle" fill="#fff">GOVERNANCE</text>
<text class="t sub" x="200" y="96" font-size="17" text-anchor="middle">settings, not code</text>
<rect x="30" y="116" width="340" height="92" rx="14" fill="#fff" stroke="#121C2E" stroke-width="3"/><text class="t cap" x="52" y="150" font-size="17" fill="#121C2E">GUARDRAIL</text><text class="t sub" x="52" y="180" font-size="16">prompt attacks blocked</text><text class="t sub" x="52" y="200" font-size="16">before the model</text>
<rect x="30" y="220" width="340" height="92" rx="14" fill="#fff" stroke="#121C2E" stroke-width="3"/><text class="t cap" x="52" y="254" font-size="17" fill="#121C2E">EVALUATION</text><text class="t sub" x="52" y="284" font-size="16">12 conversations,</text><text class="t sub" x="52" y="304" font-size="16">5 judges, every change</text>
<rect x="30" y="324" width="340" height="92" rx="14" fill="#1F7A6E" fill-opacity="0.12" stroke="#1F7A6E" stroke-width="3"/><text class="t cap" x="52" y="358" font-size="17" fill="#1F7A6E">DECISION OWNER</text><text class="t sub" x="52" y="388" font-size="16">a role in the Portal,</text><text class="t sub" x="52" y="408" font-size="16">a named, signed-in person</text>
<rect x="30" y="428" width="340" height="92" rx="14" fill="#fff" stroke="#121C2E" stroke-width="3"/><text class="t cap" x="52" y="462" font-size="17" fill="#121C2E">AUDIT LOG</text><text class="t sub" x="52" y="492" font-size="16">every check, gate route</text><text class="t sub" x="52" y="512" font-size="16">and decision recorded</text>
</svg>
