<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-labelledby="t d"><title id="t">Agent loop</title><desc id="d">The agent reasons, acts and observes. Each action calls Authorise first, and only an authorised skill or tool runs; a refusal comes back as a result. The customer is bound by the process, and the loop stops after six calls.</desc><defs><style>.t{font-family:Inter,Helvetica,Arial,sans-serif}.cap{font-weight:800;letter-spacing:0.06em}.sub{font-weight:500;fill:#3A4458}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#121C2E"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F7A6E"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8893A"/></marker></defs><rect width="400" height="560" rx="20" fill="#F5F4F0"/>
<rect x="110" y="22" width="180" height="44" rx="22" fill="#B8893A"/><text class="t cap" x="200" y="51" font-size="19" text-anchor="middle" fill="#fff">AGENT LOOP</text>
<text class="t sub" x="200" y="96" font-size="17" text-anchor="middle">Agent Workbench, on DeepSeek</text>
<circle cx="200" cy="220" r="86" fill="none" stroke="#B8893A" stroke-width="4" stroke-dasharray="10 8"/>
<rect x="140" y="118" width="120" height="40" rx="20" fill="#B8893A"/><text class="t cap" x="200" y="144" font-size="16" text-anchor="middle" fill="#fff">REASON</text>
<rect x="232" y="232" width="110" height="40" rx="20" fill="#B8893A"/><text class="t cap" x="287" y="258" font-size="16" text-anchor="middle" fill="#fff">ACT</text>
<rect x="46" y="232" width="128" height="40" rx="20" fill="#B8893A"/><text class="t cap" x="110" y="258" font-size="16" text-anchor="middle" fill="#fff">OBSERVE</text>
<line x1="287" y1="274" x2="287" y2="320" stroke="#121C2E" stroke-width="3" marker-end="url(#a)"/>
<rect x="200" y="324" width="176" height="46" rx="12" fill="#121C2E"/><text class="t cap" x="288" y="353" font-size="16" text-anchor="middle" fill="#fff">AUTHORISE?</text>
<line x1="288" y1="372" x2="288" y2="398" stroke="#B8893A" stroke-width="3" marker-end="url(#o)"/>
<rect x="200" y="402" width="176" height="60" rx="12" fill="#fff" stroke="#B8893A" stroke-width="3"/><text class="t cap" x="288" y="428" font-size="15" text-anchor="middle" fill="#8C661F">4 SKILLS</text><text class="t cap" x="288" y="450" font-size="15" text-anchor="middle" fill="#8C661F">3 TOOLS</text>
<text class="t sub" x="24" y="350" font-size="15">refusal is a result</text><text class="t sub" x="24" y="372" font-size="15">the agent observes</text>
<rect x="24" y="490" width="352" height="46" rx="12" fill="#fff" stroke="#121C2E" stroke-width="3"/><text class="t" x="200" y="519" font-size="15" font-weight="700" text-anchor="middle" fill="#121C2E">customer bound · stops after 6 calls</text>
</svg>
