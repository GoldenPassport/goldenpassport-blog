<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-labelledby="t d"><title id="t">Process orchestration</title><desc id="d">The ConciergeRequest workflow: a customer request runs the agent, then the impact and policy gate. Routine replies go straight through to the customer; held requests go to a decision owner with a deadline, and the agent words the decision.</desc><defs><style>.t{font-family:Inter,Helvetica,Arial,sans-serif}.cap{font-weight:800;letter-spacing:0.06em}.sub{font-weight:500;fill:#3A4458}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#121C2E"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1F7A6E"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B8893A"/></marker></defs><rect width="400" height="560" rx="20" fill="#F5F4F0"/>
<rect x="40" y="22" width="320" height="44" rx="22" fill="#121C2E"/><text class="t cap" x="200" y="51" font-size="19" text-anchor="middle" fill="#fff">PROCESS ORCHESTRATION</text>
<text class="t sub" x="200" y="96" font-size="17" text-anchor="middle">the ConciergeRequest workflow</text>
<rect x="110" y="114" width="180" height="46" rx="12" fill="#fff" stroke="#121C2E" stroke-width="3"/><text class="t cap" x="200" y="144" font-size="17" text-anchor="middle" fill="#121C2E">REQUEST</text>
<line x1="200" y1="162" x2="200" y2="184" stroke="#121C2E" stroke-width="3" marker-end="url(#a)"/>
<rect x="110" y="188" width="180" height="46" rx="12" fill="#B8893A"/><text class="t cap" x="200" y="218" font-size="17" text-anchor="middle" fill="#fff">AGENT</text>
<line x1="200" y1="236" x2="200" y2="258" stroke="#121C2E" stroke-width="3" marker-end="url(#a)"/>
<rect x="90" y="262" width="220" height="60" rx="12" fill="#121C2E"/><text class="t cap" x="200" y="288" font-size="16" text-anchor="middle" fill="#fff">IMPACT AND</text><text class="t cap" x="200" y="310" font-size="16" text-anchor="middle" fill="#fff">POLICY GATE</text>
<path d="M150 324 L110 360" stroke="#121C2E" stroke-width="3" marker-end="url(#a)"/><path d="M250 324 L290 360" stroke="#1F7A6E" stroke-width="3" marker-end="url(#g)"/>
<text class="t" x="98" y="410" font-size="15" font-weight="700" fill="#121C2E" text-anchor="end">straight</text><text class="t" x="98" y="428" font-size="15" font-weight="700" fill="#121C2E" text-anchor="end">through</text>
<text class="t" x="322" y="350" font-size="15" font-weight="700" fill="#1F7A6E">held</text>
<rect x="216" y="364" width="164" height="96" rx="12" fill="#1F7A6E" fill-opacity="0.12" stroke="#1F7A6E" stroke-width="3"/><text class="t cap" x="298" y="394" font-size="15" text-anchor="middle" fill="#1F7A6E">DECISION</text><text class="t cap" x="298" y="414" font-size="15" text-anchor="middle" fill="#1F7A6E">OWNER</text><text class="t sub" x="298" y="440" font-size="14" text-anchor="middle">with a deadline</text>
<line x1="298" y1="462" x2="298" y2="486" stroke="#1F7A6E" stroke-width="3" marker-end="url(#g)"/>
<line x1="110" y1="364" x2="110" y2="486" stroke="#121C2E" stroke-width="3" marker-end="url(#a)"/>
<rect x="40" y="490" width="320" height="46" rx="12" fill="#fff" stroke="#121C2E" stroke-width="3"/><text class="t cap" x="200" y="520" font-size="17" text-anchor="middle" fill="#121C2E">REPLY TO THE CUSTOMER</text>
</svg>
